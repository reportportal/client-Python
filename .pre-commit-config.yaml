# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  python: python3.10
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: '3e8a8703264a2f4a69428a0aa4dcb512790b2c8c'
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/PyCQA/pydocstyle
    rev: '07f6707e2c5612960347f7c00125620457f490a7'
    hooks:
      - id: pydocstyle
        language: system
        exclude: |
          (?x)^(
              tests/.*
          )
  - repo: https://github.com/psf/black
    rev: '258e7dbf348bc23cb70b8cdf693481c04634ebcc'
    hooks:
      - id: black
        language: system
        args: [ '--check' ]
        files: ^(reportportal_client|tests)/
  - repo: https://github.com/pycqa/isort
    rev: '0a09c783808cfe77bb3269250f663ff733d23302'
    hooks:
      - id: isort
        language: system
  - repo: https://github.com/pycqa/flake8
    rev: 'c48217e1fc006c2dddd14df54e83b67da15de5cd'
    hooks:
      - id: flake8
        language: system
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'a66e98df7b4aeeb3724184b332785976d062b92e'
    hooks:
      - id: mypy
        language: system
        args: [ "--ignore-missing-imports", "reportportal_client" ]
        pass_filenames: false
        files: ^reportportal_client/
