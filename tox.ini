[tox]
isolated_build = True
envlist =
    pep
    py39
    py310
    py311
    py312
    py313
    py314
    py315

[testenv]
deps =
    -rrequirements.txt
    -rrequirements-dev.txt

setenv   =
    AGENT_NO_ANALYTICS = 1

commands = pytest --cov=reportportal_client --cov-report=xml tests/ -s -vv

[testenv:pep]
deps =
    -rrequirements.txt
    -rrequirements-dev.txt
    -rrequirements-dev-lint.txt

skip_install = True
commands = pre-commit run --all-files --show-diff-on-failure

[gh-actions]
python =
    3.9: py39
    3.10: pep, py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
